name: ghpockit
description: "Offline-first personal finance app built with Flutter."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  cupertino_icons: ^1.0.8

  drift: 2.31.0

  drift_flutter: 0.2.8

  flutter:
    sdk: flutter

  flutter_bloc: 9.1.1

  flutter_localizations:
    sdk: flutter

  get_it: 9.2.1

  go_router: 17.2.3

  # Exact pin forced by `flutter_localizations` on Flutter 3.35.6 — any other value fails to resolve. Moves with the SDK pin (CLAUDE.md §5).
  intl: 0.20.2

  meta: 1.16.0

  uuid: 4.6.0

dev_dependencies:
  # No `bloc_test`: with the `test_api` that `flutter_test` pins, its `package:test` needs `analyzer <8`, and `build_runner` 2.15.1 needs `>=8` (CLAUDE.md §5).

  build_runner: 2.15.1

  drift_dev: 2.31.0

  flutter_test:
    sdk: flutter

  # A caret is fine here: `analysis_options.yaml` includes the rule set by file version.
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

  # Bundled, not fetched at runtime: a cold start must not depend on connectivity. Latin + Vietnamese subset (ADR-0008), SIL OFL 1.1.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
