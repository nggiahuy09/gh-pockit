# Không chạy trong build: icon đã commit sẵn theo từng platform, và `flutter_launcher_icons` không nằm trong dev_dependencies.
# Sinh lại sau khi sửa `docs/design/app-icon/gh-pockit-icon.svg`:
#
#   dart pub add --dev flutter_launcher_icons
#   dart run flutter_launcher_icons
#   dart pub remove flutter_launcher_icons

flutter_launcher_icons:
  image_path: "assets/icon/gh-pockit-icon-1024.png"

  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/adaptive-background.png"
  adaptive_icon_foreground: "assets/icon/adaptive-foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"

  ios: true
  remove_alpha_ios: true
