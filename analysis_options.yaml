# Included by file version, so bumping the package cannot silently change the rule set.
include: package:very_good_analysis/analysis_options.10.0.0.yaml

formatter:
  # Must match `dart.lineLength` in .vscode/settings.json.
  page_width: 180

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/*.mocks.dart"
    - "lib/generated_plugin_registrant.dart"
    - "test/core/database/generated/**"

  errors:
    # Golden rule 9: nothing reaches a log through `print`.
    avoid_print: error
    avoid_dynamic_calls: error
    # A missing `await` in DB/sync code commits mutations out of order.
    unawaited_futures: error
    discarded_futures: error
    unused_import: error
    unused_local_variable: error
    flutter_style_todos: warning

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: false

    # Contradicts `page_width: 180`; `dart format` is the width guard.
    lines_longer_than_80_chars: false

    # Single-method interfaces (`GPClock`, repositories) are deliberate seams for fakes and get_it.
    one_member_abstracts: false
