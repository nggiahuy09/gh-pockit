# Same gate as .githooks/pre-commit, plus tests and a debug build. Fail-fast order: cheapest check first.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# Never cancel on `main` / `dev`: every commit there keeps its own check result (CLAUDE.md §10).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  quality:
    # The name is the status check branch protection requires; renaming it leaves every PR waiting. It builds too.
    name: format → analyze → test
    runs-on: ubuntu-latest
    # A cold Gradle cache downloads the Android toolchain.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The Android Gradle plugin needs JDK 17; the runner's default moves.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # `.fvmrc` is the only place the SDK version lives — never hardcode it here.
      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter ${{ steps.fvm.outputs.version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      # Most very_good_analysis rules report at info level; without `--fatal-infos` they block nothing.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      # No flavor until W10 adds dev/prod; debug needs no signing config.
      - name: Build (debug APK)
        run: flutter build apk --debug
