# Pockit CI — the same quality gate as `.githooks/pre-commit`, plus tests.
#
# Order is deliberate and fail-fast: format → analyze → test → build.
#   format first  — it is the cheapest check and the most common failure.
#   analyze next  — a formatting diff would otherwise hide real lint errors.
#   test next     — slow; no point running it on code that does not even pass
#                   the analyzer.
#   build last    — the slowest step, and the only one that sees Gradle.
#
# `build` (CLAUDE.md §10) is a debug APK with no flavor. It used to wait for the
# dev/prod flavors, on the grounds that there was nothing to build beyond
# `flutter create` output. That stopped being true at W2: the app now bundles a
# native SQLite through `drift_flutter`, a subset font and icon assets, and those
# are exactly what break only on a clean Linux machine — which no local check
# ever is. The flavors still land at W10 with the Supabase env, and this step
# gains `--flavor dev` then. Decided 2026-09-27 (ROADMAP W4, Q15).
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# One run per ref. Pushing twice to a PR cancels the stale run instead of
# queueing it — but never on `main` or `dev`: both are protected and `dev` is
# where AB-test builds are cut from (CLAUDE.md §10), so every commit on them
# must keep its own completed check result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  quality:
    # The name stays `format → analyze → test` although the job now builds too:
    # it is the status check branch protection requires on `main` and `dev`
    # (CLAUDE.md §10), and renaming it would leave every PR waiting for a check
    # that never reports. The build step gates merges through the same check.
    name: format → analyze → test
    runs-on: ubuntu-latest
    # 20 → 30 for the build: a cold Gradle cache downloads the Android toolchain.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The Android Gradle plugin needs JDK 17. Stated rather than trusted to the
      # runner image's default, which moves; `cache: gradle` keeps the second
      # run from re-downloading the toolchain.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Single source of truth for the SDK version: `.fvmrc`. CI must never
      # hardcode 3.35.6 in parallel — that is exactly how the local SDK and the
      # CI SDK drift apart and "works on my machine" starts.
      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter ${{ steps.fvm.outputs.version }}
        # Major tag on purpose: the action's own patches (cache handling, runner
        # images) are wanted, while the thing that actually decides the build —
        # the SDK version — is pinned above.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `--output=none` = check only, never rewrite. `--set-exit-if-changed`
      # is what makes it fail; without it the command exits 0 and prints a diff
      # nobody reads.
      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      # `--fatal-infos` is MANDATORY: nearly all 209 very_good_analysis rules
      # report at `info` level and `dart analyze` exits 0 on infos alone, so
      # dropping this flag turns the strict lint set into decoration.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      # Debug, so no signing config is needed; it still runs the whole Gradle
      # graph, native libraries and asset bundling included.
      - name: Build (debug APK)
        run: flutter build apk --debug
